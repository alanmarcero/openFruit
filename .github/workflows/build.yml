name: build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !(github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}

env:
  ARTEFACTS: build/OpenFruit_artefacts/Release

jobs:
  macos:
    if: false
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Sign ad hoc
        run: |
          codesign --force --deep --sign - "$ARTEFACTS/VST3/openFruit.vst3"
          codesign --force --deep --sign - "$ARTEFACTS/AU/openFruit.component"
          codesign --force --deep --sign - "$ARTEFACTS/Standalone/openFruit.app"

      - name: Validate with pluginval
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip
          echo "3c4c533bda0c5059eea3ddaea752d757ee2025041f0f47e6bcb0e87f6082b29f  pluginval.zip" | shasum -a 256 -c -
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --validate "$ARTEFACTS/VST3/openFruit.vst3"

      - name: Package
        run: |
          mkdir -p dist
          ditto "$ARTEFACTS/VST3/openFruit.vst3" "dist/openFruit.vst3"
          ditto "$ARTEFACTS/AU/openFruit.component" "dist/openFruit.component"
          ditto "$ARTEFACTS/LV2/openFruit.lv2" "dist/openFruit.lv2"
          ditto "$ARTEFACTS/Standalone/openFruit.app" "dist/openFruit.app"
          python3 scripts/package_notices.py dist
          ditto -c -k dist openFruit-macOS.zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openFruit-macOS
          path: openFruit-macOS.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Validate with pluginval
        run: |
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip -OutFile pluginval.zip
          $hash = (Get-FileHash pluginval.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne "c08e61ce3b96db41636f8ec7e76f4c7e2c13ebdac7fa1b5a1f52b4f32ec715ab") { throw "pluginval.zip SHA-256 mismatch: $hash" }
          Expand-Archive pluginval.zip -DestinationPath pluginval
          ./pluginval/pluginval.exe --strictness-level 5 --validate "$env:ARTEFACTS/VST3/openFruit.vst3"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item -Recurse "$env:ARTEFACTS/VST3/openFruit.vst3" dist/
          Copy-Item -Recurse "$env:ARTEFACTS/LV2/openFruit.lv2" dist/
          Copy-Item "$env:ARTEFACTS/Standalone/openFruit.exe" dist/
          python scripts/package_notices.py dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path dist/* -DestinationPath openFruit-Windows.zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openFruit-Windows
          path: openFruit-Windows.zip

  linux:
    if: false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev \
            libxrender-dev libglu1-mesa-dev mesa-common-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Package
        run: |
          mkdir -p dist
          cp -r "$ARTEFACTS/VST3/openFruit.vst3" "$ARTEFACTS/LV2/openFruit.lv2" dist/
          cp "$ARTEFACTS/Standalone/openFruit" dist/
          python3 scripts/package_notices.py dist
          (cd dist && zip -qr ../openFruit-Linux.zip .)

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openFruit-Linux
          path: openFruit-Linux.zip

  release:
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') && needs.windows.result == 'success' && (needs.macos.result == 'skipped' || needs.macos.result == 'success') && (needs.linux.result == 'skipped' || needs.linux.result == 'success') }}
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Write release notes
        run: python3 scripts/release_notes.py "${{ github.ref_name }}" > release_notes.md

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: openFruit ${{ github.ref_name }}
          files: dist/openFruit-*.zip
          body_path: release_notes.md
          generate_release_notes: true

  # Renders the factory editor at its default size and commits docs/screenshots/preview.png.
  # Independent of the macOS and Linux package jobs, which stay disabled.
  update-preview:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev \
            libxrender-dev libglu1-mesa-dev mesa-common-dev xvfb

      - name: Build plugin and snapshot tool
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DOF_BUILD_TOOLS=ON -DOF_BUILD_TESTS=OFF
          cmake --build build --config Release --parallel --target render_ui_snapshot

      - name: Render factory default editor
        run: xvfb-run -a ./build/render_ui_snapshot

      - name: Commit refreshed preview if changed
        run: |
          cp assets/openFruit-screenshot.png docs/screenshots/preview.png
          if git diff --quiet -- docs/screenshots/preview.png; then
            echo "Preview unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/preview.png
          git commit -m "docs: refresh preview screenshot [skip ci]"
          git push
